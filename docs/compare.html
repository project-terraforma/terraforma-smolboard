<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terraforma SMOLBoard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <a class="brand" href="index.html">SMOLBoard</a>
        <nav class="tabs" aria-label="Primary navigation">
          <a class="tab" href="about.html">About</a>
          <a class="tab" href="leaderboard.html">Leaderboards</a>
          <a class="tab" href="methodology.html">Methodology</a>
          <a class="tab is-active" href="compare.html">Graphs</a>
          <a class="tab" href="add-model.html">Model Submission</a>
          <a class="tab" href="#paper">Paper</a>
        </nav>
      </header>

      <main>
        <section id="leaderboard-section" class="panel hidden">
          <h1 class="page-title">Geoconflation Leaderboards</h1>
          <div class="params-selector" aria-label="Parameter filters">
            <div class="selector-indicator"></div>
            <button class="filter-pill is-active" data-filter="all">All # params</button>
            <button class="filter-pill" data-filter="<5B">&lt;5B params</button>
            <button class="filter-pill" data-filter="<10B">&lt;10B params</button>
            <button class="filter-pill" data-filter="<20B">&lt;20B params</button>
          </div>
          <div class="table-wrap">
            <table id="leaderboard-table">
              <thead>
                <tr>
                  <th data-key="model">Model <span class="sort-indicator">▾</span></th>
                  <th data-key="f1">F1 <span class="sort-indicator">▾</span></th>
                  <th data-key="average_latency">Average Latency <span class="sort-indicator">▾</span></th>
                  <th data-key="precision">Precision <span class="sort-indicator">▾</span></th>
                  <th data-key="accuracy">Accuracy <span class="sort-indicator">▾</span></th>
                  <th data-key="recall">Recall <span class="sort-indicator">▾</span></th>
                  <th data-key="tokens_per_second">Tokens/second <span class="sort-indicator">▾</span></th>
                  <th data-key="benchmark_date">Benchmark Date <span class="sort-indicator">▾</span></th>
                </tr>
              </thead>
              <tbody id="leaderboard-body"></tbody>
            </table>
          </div>
        </section>

        <section id="graphs-section" class="panel">
          <h2 class="graph-header">Compare Model Metrics</h2>
          <div class="compare-layout">
            <div class="selectors">
              <div class="field">
                <label>Models</label>
                <div id="model-checkboxes" class="checkbox-list"></div>
              </div>
            </div>
            <div class="compare-results">
              <div class="compare-toolbar">
                <label class="metric-sort-label" for="metric-sort">Sort charts by</label>
                <select id="metric-sort" class="metric-sort">
                  <option value="f1">F1 Score</option>
                  <option value="accuracy">Accuracy</option>
                  <option value="precision">Precision</option>
                  <option value="recall">Recall</option>
                  <option value="average_latency">Latency</option>
                </select>
              </div>
              <div id="metric-charts" class="metric-charts"></div>
            </div>
          </div>
        </section>

        <section id="add-model-section" class="panel hidden">
          <div class="model-form-card">
            <h2 class="graph-header">Add model</h2>
            <form id="model-form" class="model-form">
              <div class="form-grid">
                <div class="form-field">
                  <label for="model-name">Model name</label>
                  <input id="model-name" name="modelName" type="text" placeholder="e.g. Llama 3.1 8B" required />
                </div>
                <div class="form-field">
                  <label for="huggingface-url">Hugging Face URL</label>
                  <input id="huggingface-url" name="huggingFaceUrl" type="url" placeholder="https://huggingface.co/..." required />
                </div>
                <div class="form-field">
                  <label for="parameter-count">Parameter number</label>
                  <input id="parameter-count" name="parameterCount" type="number" min="1" step="1" placeholder="e.g. 8000000000" required />
                </div>
              </div>
              <div class="form-actions">
                <button type="submit" class="primary-button">Save model</button>
              </div>
              <p id="form-status" class="form-status" aria-live="polite"></p>
            </form>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
