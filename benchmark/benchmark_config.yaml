benchmark:
  result_root: results/benchmark_runs
  seed: 42
  evaluator_batch_size: 16
  checkpoint_flush_every: 1

datasets:
  overture-3k:
    path: data/samples_3k_project_c_updated.parquet
    label_column: label
    positive_label: 1
    example_id: generated_row_index
    record_a_columns:
      names: names
      websites: websites
      socials: socials
      emails: emails
      phones: phones
      addresses: addresses
    record_b_columns:
      names: base_names
      websites: base_websites
      socials: base_socials
      emails: base_emails
      phones: base_phones
      addresses: base_addresses
    metadata_columns:
      source_record_id: id
      base_record_id: base_id

  medium_pairs_geo:
    path: ../datasets/geo/medium_pairs.parquet
    label_column: label
    positive_label: 1
    example_id: generated_row_index
    record_a_columns:
      names: left_names
      websites: left_websites
      socials: left_socials
      emails: left_emails
      phones: left_phones
      addresses: left_addresses
    record_b_columns:
      names: right_names
      websites: right_websites
      socials: right_socials
      emails: right_emails
      phones: right_phones
      addresses: right_addresses
    metadata_columns:
      source_record_id: left_id
      base_record_id: right_id

prompts:
  baseline:
    version: "1"
    exposed_fields: [names, websites, socials, emails, phones, addresses]
    template: |-
      You are performing place entity resolution.

      Determine whether Place A and Place B refer to the same real-world place.

      Consider differences in spelling, formatting, abbreviations, addresses, categories, and geographic information when available.

      Respond with exactly one label:

      MATCH
      NO_MATCH

      Place A:
      {record_a}

      Place B:
      {record_b}

      Answer:

adapters:
  llama_cpp:
    backend: llama.cpp
    backend_version: b10369
    server_executable: .tools/llama-b10369/llama-server.exe
    host: 127.0.0.1
    port: 8192
    gpu_layers: all
    context_size: 4096
    parallel_slots: 4
    batch_size: 2048
    micro_batch_size: 512
    flash_attention: auto
    reasoning: "off"
    request_timeout_sec: 180
    startup_timeout_sec: 300
  qwen3_llama_cpp:
    backend: llama.cpp
    backend_version: b10369
    server_executable: .tools/llama-b10369/llama-server.exe
    host: 127.0.0.1
    port: 8192
    gpu_layers: all
    context_size: 4096
    parallel_slots: 4
    batch_size: 2048
    micro_batch_size: 512
    flash_attention: auto
    reasoning: "off"
    request_timeout_sec: 180
    startup_timeout_sec: 300

