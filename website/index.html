<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terraforma SMOLBoard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">Terraforma SMOLBoard</div>
        <nav class="tabs" aria-label="Leaderboard filters">
          <button class="tab is-active" data-filter="all">All # params</button>
          <button class="tab" data-filter="<5B">&lt;5B params</button>
          <button class="tab" data-filter="<10B">&lt;10B params</button>
          <button class="tab" data-filter="<20B">&lt;20B params</button>
          <button class="tab" data-filter="graphs">Graph Comparisons</button>
        </nav>
      </header>

      <main>
        <section id="leaderboard-section" class="panel">
          <h1 class="page-title">Geoconflation Leaderboards</h1>
          <div class="table-wrap">
            <table id="leaderboard-table">
              <thead>
                <tr>
                  <th data-key="model">Model <span class="sort-indicator">▾</span></th>
                  <th data-key="f1">F1 <span class="sort-indicator">▾</span></th>
                  <th data-key="average_latency">Average Latency <span class="sort-indicator">▾</span></th>
                  <th data-key="precision">Precision <span class="sort-indicator">▾</span></th>
                  <th data-key="accuracy">Accuracy <span class="sort-indicator">▾</span></th>
                  <th data-key="recall">Recall <span class="sort-indicator">▾</span></th>
                  <th data-key="tokens_per_second">Tokens/second <span class="sort-indicator">▾</span></th>
                  <th data-key="benchmark_date">Benchmark Date <span class="sort-indicator">▾</span></th>
                </tr>
              </thead>
              <tbody id="leaderboard-body"></tbody>
            </table>
          </div>
        </section>

        <section id="graphs-section" class="panel hidden">
          <h2 class="graph-header">Compare model metrics</h2>
          <div class="selectors">
            <div class="field">
              <label>Models</label>
              <div id="model-checkboxes" class="checkbox-list"></div>
            </div>
            <div class="field">
              <label>Metrics</label>
              <div id="metric-checkboxes" class="checkbox-list">
                <label><input type="checkbox" value="accuracy" checked> Accuracy</label>
                <label><input type="checkbox" value="precision" checked> Precision</label>
                <label><input type="checkbox" value="recall" checked> Recall</label>
                <label><input type="checkbox" value="f1" checked> F1</label>
                <label><input type="checkbox" value="average_latency" checked> Latency</label>
              </div>
            </div>
          </div>
          <div id="metric-charts" class="metric-charts"></div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
